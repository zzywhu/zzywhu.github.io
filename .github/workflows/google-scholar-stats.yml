name: Update Google Scholar citations

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-scholar-stats.yml'
      - 'scripts/update_scholar_stats.py'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: scholar-stats
      - name: Fetch public citation statistics
        run: python scripts/update_scholar_stats.py --scholar-id=-KEimXoAAAAJ --output scholar-stats/gs_data.json
      - name: Publish statistics
        working-directory: scholar-stats
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Google Scholar citation statistics'
            git push origin HEAD:google-scholar-stats
          fi
