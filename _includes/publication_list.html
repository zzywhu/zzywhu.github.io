<div class="publication-browser" data-publication-browser>
    <div class="publication-filters" role="group" aria-label="Filter publications by research area" hidden>
        <button type="button" data-publication-filter="all" aria-pressed="true" aria-controls="{{ include.id }}-papers">All</button>
        {% for area in site.data.research %}
        <button type="button" data-publication-filter="{{ area.id }}" aria-pressed="false" aria-controls="{{ include.id }}-papers">{{ area.label }}</button>
        {% endfor %}
    </div>
    <div id="{{ include.id }}-papers" data-publication-list>
        {% assign pubs = site.publications | sort: 'date' | reverse %}
        {% for paper in pubs %}{% include widgets/publication_item.html item=paper %}{% endfor %}
    </div>
</div>
