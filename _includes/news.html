<div class="news-scroll" tabindex="0" aria-label="Recent news, scroll for more">
  <ul class="news-entries">
    {% assign news = site.news | sort: 'date' | reverse %}
    {% for item in news limit:site.data.display.homepage.num_news %}
    <li class="news-entry"><time class="news-date-badge" datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%b. %Y' }}</time><span class="news-icon" aria-hidden="true">{{ item.icon | default: '📌' }}</span><div>{{ item.title | markdownify }}</div></li>
    {% endfor %}
  </ul>
</div>
