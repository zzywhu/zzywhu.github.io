<table class="profile-table" style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;"><tbody>
          <tr style="padding:0px">
            <td class="profile-content" style="padding:2.5%;width:68%;vertical-align:middle">
              <p class="profile-heading" style="text-align:center"><name><span class="profile-name-en">{{ profile.primary_name }}</span><span class="profile-name-divider"> &nbsp;|&nbsp; </span><span class="profile-name-zh">{{ profile.secondary_name }}</span></name></p>
              <div class="profile-bio">{{ profile.short_bio }}</div>
			<div class="profile-divider" style="width: 100%; height: 1px; background: linear-gradient(to right, transparent, #ccc 20%, #ccc 80%, transparent); margin: 10px 0;"></div>

<p class="contact-links">
  <span class="contact-line"><a href="mailto:{{ profile.email }}" class="email-link" title="Email {{ profile.email }}">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                    <path d="m3 7 9 6 9-6"></path>
                  </svg>
                  Email: <span class="contact-sub">{{ profile.email }}</span>
                </a> <span class="contact-separator" aria-hidden="true">&nbsp;/&nbsp;</span> <a href="{{ '/files/resume-zh_CN.pdf' | relative_url }}" title="Chinese CV">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"></path>
                    <path d="M14 2v6h6"></path>
                    <path d="M8 13h8"></path>
                    <path d="M8 17h5"></path>
                  </svg>
                  中文简历
                </a></span>
  <span class="contact-line"><a href="{{ profile.gscholar }}" title="Google Scholar profile">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3 1.5 9 12 15 22.5 9 12 3Z"></path>
                    <path d="M5 12.1v4.2c0 1.2 3.1 3.2 7 3.2s7-2 7-3.2v-4.2l-7 4-7-4Z"></path>
                  </svg>
                  Google Scholar
                </a> <span class="contact-separator" aria-hidden="true">&nbsp;/&nbsp;</span> <a href="https://github.com/{{ profile.github }}" title="GitHub profile">
                  <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 .5C5.7.5.6 5.6.6 11.9c0 5 3.3 9.3 7.9 10.8.6.1.8-.3.8-.6v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 .1.5 2.7 3.2 1.9.1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.6.1-3.1 0 0 1-.3 3.2 1.2.9-.3 1.9-.4 2.9-.4s2 .1 2.9.4c2.2-1.5 3.2-1.2 3.2-1.2.6 1.5.2 2.8.1 3.1.8.9 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.8C23.4 5.6 18.3.5 12 .5Z"></path>
                  </svg>
                  Github
                </a></span>
</p>
            </td>
            <td class="profile-photo" style="padding:2.5%;width:40%;max-width:40%">
              <img class="profile-portrait" style="width:85%;max-width:85%;border-radius:8px;" alt="{{ profile.portrait_caption | escape }}" src="{{ profile.portrait_url | relative_url }}">
            </td>
          </tr>
        </tbody></table>
