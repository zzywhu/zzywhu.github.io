<!DOCTYPE HTML>
<html lang="en">
<head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{% unless page.title == "Homepage" %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
  <meta name="author" content="{{ site.data.profile.primary_name | escape }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{ '/stylesheet.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <style>
    body, * {
      cursor: url('{{ '/images/icon/cursor.png' | relative_url }}'), auto;
    }
    a, a * {
      cursor: url('{{ '/images/icon/cursor-pointer.png' | relative_url }}'), pointer !important;
    }
  </style>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="{{ '/template-components.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <table class="homepage-table" style="width:100%;max-width:800px;border:0;border-spacing:0;border-collapse:separate;margin-right:auto;margin-left:auto;"><tbody><tr><td class="page-cell">
      {% unless page.title == 'Homepage' %}
      <nav class="subpage-nav" aria-label="Site navigation">{% for item in site.data.navigation.pages %}<a href="{{ item.url | relative_url }}">{{ item.name }}</a>{% endfor %}</nav>
      <h1 class="subpage-title">{{ page.title }}</h1>
      {% endunless %}
      {{ content }}
    </td></tr></tbody></table>
  </main>
  <button id="backToTop" type="button" title="Back to top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <div id="toast" class="toast-message" role="status" aria-live="polite"></div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
