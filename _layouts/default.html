<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | escape }}">
    <title>{% unless page.title == "Homepage" %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main id="main">
        {% unless page.title == 'Homepage' %}
        <nav class="section-links" aria-label="Site navigation">{% for item in site.data.navigation.pages %}<a href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title %} aria-current="page"{% endif %}>{{ item.name }}</a>{% endfor %}</nav>
        <h1>{{ page.title }}</h1>
        {% endunless %}
        {{ content }}
    </main>
    <footer>© {{ site.time | date: '%Y' }} {{ site.data.profile.primary_name }}. <a href="https://github.com/luost26/academic-homepage">Original template</a>.</footer>
</body>
</html>
