<!DOCTYPE HTML>
<html lang="en">
<head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>{% unless page.title == 'Homepage' %}{{ page.title | escape }} · {% endunless %}{{ site.title | escape }}</title>
  <meta name="author" content="{{ site.data.profile.primary_name | escape }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="{{ '/stylesheet.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <style>
    body, * {
      cursor: url('images/icon/cursor.png'), auto;
    }
    a, a * {
      cursor: url('images/icon/cursor-pointer.png'), pointer !important;
    }
  </style>
</head>
<body>
  <table id="about" class="page-section" style="width:100%;max-width:800px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;"><tbody>
    <tr style="padding:0px">
      <td style="padding:0px">
      {{ content }}
      </td>
    </tr>
  </table>
  <!-- Back to Top Button -->
  <button id="backToTop" onclick="scrollToTop()" title="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script src="{{ '/assets/js/template.js' | relative_url }}" defer></script>
</body>
</html>
